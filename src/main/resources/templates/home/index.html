<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Game Management Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="card">
        <h2>Welcome!</h2>
        <p class="text-muted">This dashboard provides an overview and quick access to all management functions for games, tournaments, and players.</p>
        <div class="mt-2">
            <a class="btn" th:href="@{/games}">Manage Games</a>
            <a class="btn" th:href="@{/players}">Manage Players</a>
            <a class="btn" th:href="@{/tournaments}">Manage Tournaments</a>
        </div>
    </div>
</main>

<footer>
    &copy; 2026 Game Management Dashboard
</footer>

</body>
</html>
